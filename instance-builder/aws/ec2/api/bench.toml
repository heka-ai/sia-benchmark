benchmark_id = "dummy-benchmark"
provider = "aws"
inference_engine = "vllm"
api_key = "dummy-api-key"

[aws]
region = "us-east-1"
gpu_ami = "xxxxxxxxxxxxxxxx"
cpu_ami = "xxxxxxxxxxxxxxxx"

# the instance type is the ec2 instance type of the
# instance that will be used to run the benchmark
gpu_instance_type = "g5.xlarge"
cpu_instance_type = "t3.micro"

# login to aws using a profile
# you can create a profile using the aws cli
# aws configure --profile stratumn-staging
profile_name = "xxxxxxxxxxxxxxxx"

# or you can use access and secret keys
# access_key = ""
# secret_key = ""

[benchmark]
token = "xxxxxxxxxxxxxxxx"
task = "auto"
dataset_name = "hf"
dataset_path = "heka-ai/sharegpt-english-10k-vllm-serving-benchmark"
hf_revision = "faf892b9787e773496c910271d7fa160c44ffb0f"
hf_split = "train"
num_prompts = 500
seed = 42

[instance]
health_check = "/health"

[vllm]
model = "meta-llama/Llama-3.2-3B-Instruct"
seed = 42
dtype = "half"
kv-cache-dtype = "auto"
max-model-len = "4096"
max-num-batched-tokens = ""
max-num-seqs = 1024
tokenizer-mode = "auto"
